packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  "@clerk/expo": ^4.1.2
  "@clerk/nextjs": ^7.5.13
  "@tailwindcss/postcss": ^4.1.16
  "@types/node": ^22.18.12
  convex: ^1.42.1
  tailwindcss: ^4.1.16
  typescript: 7.0.2
  zod: ^4.1.12

catalogs:
  # Only the packages ui-mobile shares with apps/expo — bump here, not per-package.
  # `expo install --fix` can't read catalog: specs; when it flags one of these,
  # bump the version here instead of letting it rewrite the spec in place.
  native:
    react-native: 0.86.2
    react-native-mmkv: ^3.3.3
    react-native-reanimated: 4.5.1
  react19:
    "@types/react": ~19.2.3
    "@types/react-dom": ~19.2.3
    react: 19.2.3
    react-dom: 19.2.3
  typescript5:
    typescript: ^5.9.3

linkWorkspacePackages: true

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
