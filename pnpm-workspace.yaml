packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  "@clerk/expo": ^4.1.2
  "@clerk/nextjs": ^7.5.13
  "@tailwindcss/postcss": ^4.1.16
  "@types/node": ^22.18.12
  convex: ^1.42.1
  tailwindcss: ^4.1.16
  typescript: ~6.0.3
  vitest: ^4.1.10
  zod: ^4.1.12

catalogs:
  # Only the packages ui-mobile shares with apps/expo — bump here, not per-package.
  # `expo install --fix` can't read catalog: specs; when it flags one of these,
  # bump the version here instead of letting it rewrite the spec in place.
  native:
    "@lodev09/react-native-true-sheet": ^3.11.11
    phosphor-react-native: ^3.0.6
    react-native: 0.86.3
    react-native-mmkv: ^4.3.2
    react-native-nitro-modules: ^0.37.0
    react-native-reanimated: 4.5.1
    react-native-svg: 15.15.4
  react19:
    "@types/react": ~19.2.3
    "@types/react-dom": ~19.2.3
    react: 19.2.3
    react-dom: 19.2.3

linkWorkspacePackages: true

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
